      - ".github/workflows/yxorp-source-check.yml"
  workflow_dispatch:
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python3 -m pip install --user PyYAML Jinja2 'ansible-core>=2.17,<2.23'
      - name: Check desired-state contract
        run: |
          python3 -m unittest discover -s tests -p 'test_yxorp_contract.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_stage_removal.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_status.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_yarn_content.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_readiness.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage_square.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage_prism.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage_search.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage_dir.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage_kuma.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_kuma_redirect_diagnose.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kuma_redirect_policy.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kuma_wire_observe.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage_pihole.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage_yarn_inner.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_legacy_yarn_observe.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvar_legacy_yarn_consumer_signal.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvar_legacy_yarn_source_classes.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvar_legacy_yarn_source_addresses.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_stage_mounted_config.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_config_update_lifecycle.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_kvin_yarn_transport_diagnose.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_upstreams_observe.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_incumbent_parity.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_discrepancies_observe.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_npm_path_diagnose.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_yarn_route_observe.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_publication_review.py'
          python3 -m unittest discover -s tests -p 'test_yxorp_behavior_observer.py'
          python3 -m unittest discover -s tests -p 'test_kuma_desired.py'
          python3 -m unittest discover -s tests -p 'test_kuma_role_contract.py'
          python3 -m unittest discover -s tests -p 'test_kuma_stage_removal.py'
          python3 -m unittest discover -s tests -p 'test_kuma_admin_bootstrap.py'
          python3 -m unittest discover -s tests -p 'test_kuma_admin_diagnose.py'
          python3 -m unittest discover -s tests -p 'test_kuma_vault_password.py'
          python3 -m unittest discover -s tests -p 'test_kuma_image_qualification.py'
      - name: Check Ansible playbook syntax
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-peanut-preflight.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-peanut-dns-observe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-peanut-trial-firewall.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-peanut.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-peanut-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-peanut-yarn-content.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-readiness.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-remove.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-square-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-prism-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-search-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-dir-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-kuma-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-kuma-redirect-diagnose.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-kuma-wire-observe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-pihole-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-yarn-inner-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-legacy-yarn-observe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvar-legacy-yarn-consumer-signal.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvar-legacy-yarn-source-classes.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvar-legacy-yarn-source-addresses.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-mounted-config-observe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-yarn-transport-diagnose.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-kvin-stage-peer-probe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-upstreams-observe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-incumbent-parity.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-discrepancies-observe.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-npm-path-diagnose.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-yarn-route-observe.yml --syntax-check
          ansible-playbook -i 'localhost,' tests/fixtures/yxorp-route-get-parse.yml -c local
          python3 tests/fixtures/verify-yxorp-kvin-stage-guard.py
          python3 tests/fixtures/verify-yxorp-kvin-yarn-transport-report.py
          python3 tests/fixtures/verify-yxorp-kvin-square-stage.py
          python3 tests/fixtures/verify-yxorp-kvin-prism-stage.py
          python3 tests/fixtures/verify-yxorp-kvin-search-stage.py
          python3 tests/fixtures/verify-yxorp-kvin-dir-stage.py
          python3 tests/fixtures/verify-yxorp-kvin-kuma-stage.py
          python3 tests/fixtures/verify-yxorp-kvin-pihole-stage.py
          python3 tests/fixtures/verify-yxorp-kvin-yarn-inner-stage.py
          python3 tests/fixtures/verify-yxorp-kvin-yarn-inner-config.py
          python3 tests/fixtures/verify-yxorp-kuma-redirect-diagnose.py
          python3 tests/fixtures/verify-yxorp-kvin-stage-mounted-config.py
          python3 tests/fixtures/verify-yxorp-config-update-lifecycle.py
          ansible-playbook -i 'localhost,' tests/fixtures/yxorp-redirect-urlsplit.yml -c local
          python3 - <<'PY'
          import pathlib, yaml
          play = yaml.safe_load(pathlib.Path('ansible/yxorp-npm-path-diagnose.yml').read_text())
          tasks = play[1]['tasks']
          commands = [task['ansible.builtin.command']['argv'] for task in tasks if 'ansible.builtin.command' in task]
          assert len(commands) == 1 and commands[0][:5] == ['podman', 'exec', 'nginx-proxman', 'node', '-e']
          pathlib.Path('/tmp/yxorp-npm-node-diagnostic.js').write_text(commands[0][-1])
          PY
          node --check /tmp/yxorp-npm-node-diagnostic.js
          node --check /tmp/yxorp-npm-node-diagnostic.js
          node --check tools/observe-yxorp-kvar-yarn-usage.js
          node --check tools/observe-yxorp-kvar-yarn-source-classes.js
          node --check tools/observe-yxorp-kvar-yarn-source-addresses.js
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-peanut-status.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-peanut-remove.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-qualify-image.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/yxorp-inspect-npm.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/kuma.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/kuma-stage-remove.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/kuma-admin-bootstrap.yml --syntax-check
          ansible-playbook -i ansible/inventory/hosts.yml ansible/kuma-admin-diagnose.yml --syntax-check
          bash -n tools/kuma-set-vault-password.sh
          node --check tools/kuma-admin-init.js
          node tests/fixtures/verify-kuma-admin-init.js
          ansible-playbook -i ansible/inventory/hosts.yml ansible/kuma-qualify-image.yml --syntax-check
          python3 tests/fixtures/verify-kuma-image-metadata.py
          ansible-playbook -i 'localhost,' ansible/yxorp-preview.yml --syntax-check
      - name: Render on the CI runner without connecting to Sanctum
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ansible-playbook -i 'localhost,' ansible/yxorp-preview.yml
          grep -q 'server_name yarn.nexus.sanctum;' /tmp/sanctum-yxorp-proposed.conf
          if grep -q 'server_name joule.nexus.sanctum;' /tmp/sanctum-yxorp-proposed.conf; then
            echo 'Unqualified Prism route must not be active in first preview' >&2
            exit 1
          fi
      - name: Validate generated syntax with real Nginx (synthetic DNS only)
        run: |
          # Hosted runner image already has package indexes; avoid blocking
          # the actual source checks on a redundant apt index refresh.
          # Keep real Nginx parser and HTTP integration coverage unchanged.
          if ! command -v nginx >/dev/null 2>&1; then
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nginx-core
          fi
          echo '127.0.0.1 yarn.inner.sanctum kvin.outer.sanctum kvar.outer.sanctum' | sudo tee -a /etc/hosts
          sudo nginx -t -c /tmp/sanctum-yxorp-proposed.conf
          python3 - <<'PY'
          from pathlib import Path
          from jinja2 import Environment, FileSystemLoader, StrictUndefined
          import yaml
          routes = yaml.safe_load(Path('data/yxorp-routes.yml').read_text())['yxorp_routes']
          for route in routes:
              route['enabled'] = True
          template = Environment(loader=FileSystemLoader('ansible/roles/yxorp/templates'),
                                 undefined=StrictUndefined).get_template('nginx.conf.j2')
          Path('/tmp/sanctum-yxorp-all-routes.conf').write_text(
              template.render(yxorp_routes=routes), encoding='utf8')
          PY
          sudo nginx -t -c /tmp/sanctum-yxorp-all-routes.conf
      - name: Exercise loopback-only HTTP proxy behavior (synthetic backends)
        run: |
          python3 tools/test-yxorp-http.py ansible/roles/yxorp/templates/nginx.conf.j2
      - name: Inspect upstream ARM64 image candidates (no pulls)
        run: |
          python3 tools/inspect-registry-candidates.py

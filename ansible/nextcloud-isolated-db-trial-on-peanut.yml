---
# Source-only Services-to-Maintenance integration: run ONLY Maintenance's
# owner-written restore helper on the already-retained Peanut-only dump.
# The helper creates a separate rootless PostgreSQL container with
# --network=none and a private password/receipt handoff; NO shared DB
# service, DNS, route, Kvin, or production Nextcloud writes.
# This is a DB restoration contract, not full Nextcloud app acceptance.
- name: Coordinate one privately retained Nextcloud-only PostgreSQL restore on Peanut
  hosts: yxorp_test
  become: false
  gather_facts: true
  vars:
    # Approved Maintenance source revision, not a runtime image pin.
    # Read its two helper files from Git objects on the controller; never
    # advance either host's revision-gated Maintenance working tree.
    nextcloud_db_trial_owner_revision: 7a5f318505d6bd44b909c68240ffc7232015c782
    nextcloud_db_trial_controller_owner_repo: /home/wdc2/src/sanctum-maintenance
    nextcloud_db_trial_owner_dir: "{{ nextcloud_db_trial_dest }}/maintenance-helper"
    nextcloud_db_trial_owner_helper: "{{ nextcloud_db_trial_owner_dir }}/restore-nextcloud-postgresql"
    nextcloud_db_trial_owner_files:
      - backup-nextcloud-postgresql
      - restore-nextcloud-postgresql
    # Restore trials follow supported major 18, not yesterday's rejected
    # permanently frozen runtime digest. This does NOT update shared PG.
    nextcloud_db_trial_pg_image: docker.io/library/postgres:18
    nextcloud_db_trial_recovery_id: "{{ nextcloud_isolated_recovery_id | default('UNSET') }}"
    nextcloud_db_trial_base: /home/wdc2/.local/share/sanctum-services/nextcloud-restore-trials
    nextcloud_db_trial_bundle: "/home/wdc2/.local/share/sanctum-services/backups/nextcloud/{{ nextcloud_db_trial_recovery_id }}"
    nextcloud_db_trial_dest: "{{ nextcloud_db_trial_base }}/{{ nextcloud_db_trial_recovery_id }}"
    nextcloud_db_trial_private_handoff: "{{ nextcloud_db_trial_dest }}/postgresql-trial"
    nextcloud_db_trial_password_file: "{{ nextcloud_db_trial_private_handoff }}/postgresql-trial-password"
    nextcloud_db_trial_receipt_file: "{{ nextcloud_db_trial_private_handoff }}/postgresql-trial.json"
    nextcloud_db_trial_expected_sha_script: >-
      import json,re,sys,pathlib;
      p=pathlib.Path(sys.argv[1]);
      m=json.loads(p.read_text(encoding='utf-8'));
      a=m['artifacts']['database']['sha256'];
      assert re.fullmatch('[a-f0-9]{64}',a);
      print(a)
  tasks:
    - name: Require exact rootless Peanut and distinct isolated database trial approval
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'peanut.arcane.sanctum'
          - ansible_facts['fqdn'] == inventory_hostname
          - ansible_facts['user_id'] == 'wdc2'
          - ansible_user == 'wdc2'
          - ansible_facts['env']['HOME'] == '/home/wdc2'
          - not ansible_check_mode
          - nextcloud_isolated_db_trial_approved | default(false) | bool
          - nextcloud_maintenance_restore_contract_approved | default(false) | bool
          - nextcloud_db_trial_recovery_id is match('^nextcloud-[0-9]{8}t[0-9]{6}$')
          - nextcloud_db_trial_owner_revision == '7a5f318505d6bd44b909c68240ffc7232015c782'
          - nextcloud_db_trial_controller_owner_repo == '/home/wdc2/src/sanctum-maintenance'
          - nextcloud_db_trial_owner_dir == nextcloud_db_trial_dest ~ '/maintenance-helper'
          - nextcloud_db_trial_owner_helper == nextcloud_db_trial_owner_dir ~ '/restore-nextcloud-postgresql'
          - nextcloud_db_trial_pg_image == 'docker.io/library/postgres:18'
        fail_msg: >-
          Cannot run a DB restore on a shared server or without explicit
          approval of the isolated Maintenance-owned handoff contract.

    - name: Inspect original Peanut recovery bundle and staged app files
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - "{{ nextcloud_db_trial_bundle }}"
        - "{{ nextcloud_db_trial_dest }}"
        - "{{ nextcloud_db_trial_dest }}/html/config/config.php"
        - "{{ nextcloud_db_trial_dest }}/html/data"
        - "{{ nextcloud_db_trial_dest }}/private/nextcloud.env"
        - "{{ nextcloud_db_trial_owner_dir }}"
        - "{{ nextcloud_db_trial_private_handoff }}"
      register: nextcloud_db_trial_existing
      no_log: true

    - name: Require previously accepted isolated files and a fresh owner-private handoff
      ansible.builtin.assert:
        that:
          - nextcloud_db_trial_existing.results[0].stat.isdir | default(false)
          - nextcloud_db_trial_existing.results[0].stat.mode == '0700'
          - not (nextcloud_db_trial_existing.results[0].stat.islnk | default(false))
          - nextcloud_db_trial_existing.results[1].stat.isdir | default(false)
          - nextcloud_db_trial_existing.results[1].stat.mode == '0700'
          - nextcloud_db_trial_existing.results[2].stat.isreg | default(false)
          - not (nextcloud_db_trial_existing.results[2].stat.islnk | default(false))
          - nextcloud_db_trial_existing.results[3].stat.isdir | default(false)
          - nextcloud_db_trial_existing.results[4].stat.isreg | default(false)
          - not (nextcloud_db_trial_existing.results[5].stat.islnk | default(false))
          - not (nextcloud_db_trial_existing.results[5].stat.exists | default(false))
            or (nextcloud_db_trial_existing.results[5].stat.isdir | default(false)
                and nextcloud_db_trial_existing.results[5].stat.pw_name == 'wdc2'
                and nextcloud_db_trial_existing.results[5].stat.mode == '0700')
          - not (nextcloud_db_trial_existing.results[6].stat.exists | default(false))
          - not (nextcloud_db_trial_existing.results[6].stat.islnk | default(false))
        fail_msg: >-
          Require already-restored isolated HTML/private files, an
          existing private retained bundle, a safe helper staging location,
          and NO previously used handoff directory.
          Do not re-extract or overwrite any accepted restore trial.

    - name: Inspect already retained Peanut recovery integrity without printing contents
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tools/nextcloud-recovery-bundle.py') }}"
          - "{{ nextcloud_db_trial_bundle }}"
      register: nextcloud_db_trial_verified_bundle
      changed_when: false
      no_log: true

    - name: Require verified application files and PostgreSQL custom dump
      ansible.builtin.assert:
        that:
          - (nextcloud_db_trial_verified_bundle.stdout | from_json).archive_and_dump_hashes_match_manifest | bool
          - (nextcloud_db_trial_verified_bundle.stdout | from_json).nextcloud_required_paths_present_in_archive | bool
          - (nextcloud_db_trial_verified_bundle.stdout | from_json).postgresql_custom_dump_header_recognized | bool
        fail_msg: Incomplete or changed Peanut bundle; refused to create a database container.

    - name: Identify the existing Kvin controller
      ansible.builtin.command:
        argv: [hostname, -f]
      delegate_to: localhost
      register: nextcloud_db_trial_controller
      changed_when: false

    - name: Require Kvin as the controller for owner-source staging
      ansible.builtin.assert:
        that:
          - nextcloud_db_trial_controller.stdout | trim == 'kvin.outer.sanctum'

    - name: Check whether the reviewed Maintenance revision is already available in controller Git objects
      ansible.builtin.command:
        argv: [git, -C, "{{ nextcloud_db_trial_controller_owner_repo }}", cat-file, -t, "{{ nextcloud_db_trial_owner_revision }}"]
      delegate_to: localhost
      register: nextcloud_db_trial_owner_object
      changed_when: false
      failed_when: false

    - name: Fetch Maintenance source objects if needed without changing its scheduled checkout
      ansible.builtin.command:
        # Fetch only the reviewed object; do not move any ref, scheduled
        # checkout, or FETCH_HEAD in the controller's Maintenance repository.
        argv: [git, -C, "{{ nextcloud_db_trial_controller_owner_repo }}", fetch, --no-tags, --no-write-fetch-head, origin, "{{ nextcloud_db_trial_owner_revision }}"]
      delegate_to: localhost
      when: nextcloud_db_trial_owner_object.rc != 0 or nextcloud_db_trial_owner_object.stdout | trim != 'commit'
      changed_when: true

    - name: Read the two reviewed owner helper files from the exact Maintenance revision
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ nextcloud_db_trial_controller_owner_repo }}"
          - show
          - "{{ nextcloud_db_trial_owner_revision }}:tools/{{ item }}"
        strip_empty_ends: false
      delegate_to: localhost
      loop: "{{ nextcloud_db_trial_owner_files }}"
      register: nextcloud_db_trial_owner_sources
      changed_when: false

    - name: Create a private owner-helper staging directory inside the existing trial
      ansible.builtin.file:
        path: "{{ nextcloud_db_trial_owner_dir }}"
        state: directory
        mode: '0700'

    - name: Stage only the two reviewed Maintenance helpers on Peanut
      ansible.builtin.copy:
        content: "{{ item.stdout }}"
        dest: "{{ nextcloud_db_trial_owner_dir }}/{{ item.item }}"
        mode: '0600'
      loop: "{{ nextcloud_db_trial_owner_sources.results }}"
      loop_control:
        label: "{{ item.item }}"
      no_log: true

    - name: Observe compatible PostgreSQL 18 restore-image contract in Maintenance source
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import runpy,sys; print(runpy.run_path(sys.argv[1])['IMAGE'])"
          - "{{ nextcloud_db_trial_owner_helper }}"
      register: nextcloud_db_trial_owner_image_contract
      changed_when: false
      no_log: true

    - name: Refuse restore unless Maintenance's actual helper uses the moving PostgreSQL major channel
      ansible.builtin.assert:
        that:
          - (nextcloud_db_trial_owner_image_contract.stdout | trim) == nextcloud_db_trial_pg_image
        fail_msg: >-
          The staged Maintenance helper does not select the agreed moving
          PostgreSQL 18 channel. Refuse any image pull or database trial,
          and reconcile the reviewed owner source before continuing.

    - name: Check whether supported PostgreSQL 18 image is already cached on Peanut
      ansible.builtin.command:
        argv: [podman, image, exists, "{{ nextcloud_db_trial_pg_image }}"]
      register: nextcloud_db_trial_image_exists
      changed_when: false
      failed_when: false

    - name: Cache only supported PostgreSQL 18 major channel when separately approved and absent
      ansible.builtin.command:
        argv: [podman, pull, "{{ nextcloud_db_trial_pg_image }}"]
      register: nextcloud_db_trial_image_stage
      changed_when: nextcloud_db_trial_image_stage.rc == 0
      when:
        - nextcloud_db_trial_image_exists.rc != 0
        - nextcloud_isolated_db_image_cache_approved | default(false) | bool
      no_log: true

    - name: Inspect supported PostgreSQL 18 image, not a frozen runtime digest
      ansible.builtin.command:
        argv: [podman, image, inspect, "{{ nextcloud_db_trial_pg_image }}"]
      register: nextcloud_db_trial_platform
      changed_when: false
      failed_when: false
      no_log: true

    - name: Refuse unknown or incompatible PostgreSQL image before touching private handoff
      ansible.builtin.assert:
        that:
          - nextcloud_db_trial_platform.rc == 0
          - (nextcloud_db_trial_platform.stdout | from_json | length) == 1
          - (nextcloud_db_trial_platform.stdout | from_json)[0].Os == 'linux'
          - (nextcloud_db_trial_platform.stdout | from_json)[0].Architecture == ({'aarch64':'arm64','x86_64':'amd64'}[ansible_facts['architecture']])
          - (nextcloud_db_trial_platform.stdout | from_json)[0].Id is match('^(sha256:)?[a-f0-9]{64}$')
        fail_msg: >-
          The Maintenance-aligned PostgreSQL 18 image is absent or
          not native on Peanut. Pass the separately authorized image-cache
          option if absent, or coordinate an owner-compatible image;
          NEVER use production PostgreSQL.

    - name: Inspect actual cached PostgreSQL server version without a database or network
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - --pull=never
          - --network=none
          - --read-only
          - --cap-drop=all
          - --security-opt=no-new-privileges
          - --entrypoint=postgres
          - "{{ nextcloud_db_trial_pg_image }}"
          - --version
      register: nextcloud_db_trial_image_version
      changed_when: false
      no_log: true

    - name: Require PostgreSQL 18 isolated trial binary matches owner exporter major
      ansible.builtin.assert:
        that:
          - (nextcloud_db_trial_image_version.stdout | trim) is match('^postgres [(]PostgreSQL[)] 18[.][0-9]+')
        fail_msg: Isolated restore must use Maintenance's compatible PostgreSQL 18 version.

    - name: Read only the expected database-member SHA256 from verified private manifest
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ nextcloud_db_trial_expected_sha_script }}"
          - "{{ nextcloud_db_trial_bundle }}/manifest.json"
      register: nextcloud_db_trial_expected_sha
      changed_when: false
      no_log: true

    - name: Require properly formed private archive digest before owner helper
      ansible.builtin.assert:
        that:
          - (nextcloud_db_trial_expected_sha.stdout | trim) is match('^[a-f0-9]{64}$')
        fail_msg: The retained recovery manifest lacks its verified DB SHA256.

    - name: Create only a fresh private handoff directory under previously staged files
      ansible.builtin.file:
        path: "{{ nextcloud_db_trial_private_handoff }}"
        state: directory
        mode: '0700'

    - name: Invoke ONLY the Maintenance-owned isolated Nextcloud PostgreSQL restore helper
      ansible.builtin.command:
        argv:
          - python3
          - "{{ nextcloud_db_trial_owner_helper }}"
          - "{{ nextcloud_db_trial_bundle }}/nextcloud-postgresql.dump"
          - "{{ nextcloud_db_trial_expected_sha.stdout | trim }}"
          - "{{ nextcloud_db_trial_password_file }}"
      register: nextcloud_db_trial_owner_result
      async: 2400
      poll: 15
      changed_when: nextcloud_db_trial_owner_result.rc == 0
      no_log: true

    - name: Require owner helper reports retained networkless test database, not app restore
      ansible.builtin.assert:
        that:
          - (nextcloud_db_trial_owner_result.stdout | from_json).status == 'isolated_database_ready_for_application'
          - (nextcloud_db_trial_owner_result.stdout | from_json).database == 'nextcloud_restore'
          - (nextcloud_db_trial_owner_result.stdout | from_json).username == 'nextcloud_restore'
          - (nextcloud_db_trial_owner_result.stdout | from_json).host == '127.0.0.1'
          - (nextcloud_db_trial_owner_result.stdout | from_json).port | int == 5432
          - (nextcloud_db_trial_owner_result.stdout | from_json).container_id is match('^[a-f0-9]{64}$')
          - (nextcloud_db_trial_owner_result.stdout | from_json).password_file == nextcloud_db_trial_password_file
          - (nextcloud_db_trial_owner_result.stdout | from_json).network == ('container:' ~ (nextcloud_db_trial_owner_result.stdout | from_json).container_id)
          - not ((nextcloud_db_trial_owner_result.stdout | from_json).application_started | bool)
          - not ((nextcloud_db_trial_owner_result.stdout | from_json).production_database_contacted | bool)
          - (nextcloud_db_trial_owner_result.stdout | from_json).restored_application_tables | int > 0
        fail_msg: Owner restore helper did not return the required networkless, private DB-only receipt.

    - name: Inspect new isolated database container without exposing its environment
      ansible.builtin.command:
        argv:
          - podman
          - container
          - inspect
          - "{{ (nextcloud_db_trial_owner_result.stdout | from_json).container_id }}"
      register: nextcloud_db_trial_runtime
      changed_when: false
      no_log: true

    - name: Require actually running rootless networkless owner-labelled PostgreSQL trial
      ansible.builtin.assert:
        that:
          - (nextcloud_db_trial_runtime.stdout | from_json | length) == 1
          - (nextcloud_db_trial_runtime.stdout | from_json)[0].State.Running | bool
          - (nextcloud_db_trial_runtime.stdout | from_json)[0].HostConfig.NetworkMode == 'none'
          - (nextcloud_db_trial_runtime.stdout | from_json)[0].Config.Labels['io.sanctum.nextcloud-restore'] == 'peanut'
        fail_msg: Isolated database container does not meet the owner networkless isolation contract.

    - name: Check owner's private credential and handoff receipt without revealing bytes
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
        get_checksum: false
      loop:
        - "{{ nextcloud_db_trial_password_file }}"
        - "{{ nextcloud_db_trial_receipt_file }}"
      register: nextcloud_db_trial_handoff_files
      no_log: true

    - name: Require both handoff files are normal owner-private files
      ansible.builtin.assert:
        that:
          - nextcloud_db_trial_handoff_files.results | length == 2
          - nextcloud_db_trial_handoff_files.results | map(attribute='stat.isreg') | select('equalto', true) | list | length == 2
          - nextcloud_db_trial_handoff_files.results | map(attribute='stat.mode') | select('equalto', '0600') | list | length == 2
          - not (nextcloud_db_trial_handoff_files.results[0].stat.islnk | default(false))
          - not (nextcloud_db_trial_handoff_files.results[1].stat.islnk | default(false))
        fail_msg: The isolated database owner did not produce private handoff files.

    - name: Report actual independent Nextcloud-only PostgreSQL trial ready for isolated application
      ansible.builtin.debug:
        msg:
          host: peanut.arcane.sanctum
          source_recovery_id: "{{ nextcloud_db_trial_recovery_id }}"
          owner: sanctum-maintenance
          owner_helper_revision: "{{ nextcloud_db_trial_owner_revision }}"
          owner_helper_path: "{{ nextcloud_db_trial_owner_helper }}"
          restored_application_tables: "{{ (nextcloud_db_trial_owner_result.stdout | from_json).restored_application_tables }}"
          isolated_db_container: "{{ (nextcloud_db_trial_owner_result.stdout | from_json).container_id }}"
          isolated_postgresql_ready: true
          owner_handoff_private: true
          app_files_previously_restored_and_untouched: true
          isolated_network: none
          shared_production_database_unmodified: true
          production_kvin_not_contacted: true
          restored_nextcloud_application_not_started: true
          full_app_restore_not_yet_accepted: true
          next_action: Services start recovered 34.0.5 Nextcloud against the isolated DB namespace and validate files, Calendar and login

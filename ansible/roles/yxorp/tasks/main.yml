---
# Input validation deliberately precedes all host file and service mutations.
- name: Require a specifically selected rootful HTTP 80 deployment target
  ansible.builtin.assert:
    that:
      - ansible_facts['fqdn'] == inventory_hostname
      - yxorp_bind_address == '0.0.0.0'
      - yxorp_host_port | int == 80
      - >-
        (yxorp_deployment_scope == 'peanut_trial' and
         inventory_hostname == 'peanut.arcane.sanctum' and
         yxorp_peanut_test_approved | default(false) | bool and
         yxorp_image == 'docker.io/library/nginx:stable-alpine') or
        (yxorp_deployment_scope == 'kvin_stage' and
         inventory_hostname == 'kvin.outer.sanctum' and
         yxorp_kvin_stage_approved | default(false) | bool and
         not (yxorp_production_cutover_approved | bool) and
         yxorp_image is match('^docker.io/library/nginx@sha256:[a-f0-9]{64}$') and
         yxorp_config_dir == '/etc/sanctum-services/yxorp-kvin-stage' and
         yxorp_quadlet_file == '/etc/containers/systemd/sanctum-yxorp-kvin-stage.container' and
         yxorp_service_name == 'sanctum-yxorp-kvin-stage.service' and
         yxorp_container_name == 'sanctum-yxorp-kvin-stage') or
        (yxorp_deployment_scope == 'kvin_production' and
         inventory_hostname == 'kvin.outer.sanctum' and
         yxorp_production_cutover_approved | bool and
         yxorp_image is match('^docker.io/library/nginx@sha256:[a-f0-9]{64}$'))
      - yxorp_routes | length > 0
      - (yxorp_routes | map(attribute='hostname') | list | unique | length) == (yxorp_routes | length)
    fail_msg: >-
      YXORP may be installed only for the authorized Peanut test,
      separately approved removable Kvin stage, or independently
      authorized Kvin production cutover. Normal host TCP/80 only;
      the firewall and authoritative DNS remain externally owned.

- name: Reject unsafe Nginx route tokens and invalid data
  ansible.builtin.assert:
    that:
      - item.hostname is match('^[a-z0-9][a-z0-9.-]*[a-z0-9]$')
      - item.upstream_host is match('^[a-z0-9][a-z0-9.-]*[a-z0-9]$')
      - item.upstream_scheme == 'http'
      - item.upstream_port | int >= 1
      - item.upstream_port | int <= 65535
      - item.enabled is boolean
      - item.websocket is boolean
    fail_msg: "Unsafe or incomplete route: {{ item.hostname | default('unknown') }}"
  loop: "{{ yxorp_routes }}"

# DNS source and permanent firewalld are Maintenance-owned. The full-LAN
# Peanut trial uses the host resolver and normal host listener, matching
# Kvin's intended operational proxy networking. Only the separately authorized
# temporary firewall admission is managed by the trial's wrapper play.
- name: Create YXORP system configuration directory
  ansible.builtin.file:
    path: "{{ yxorp_config_dir }}"
    state: directory
    mode: "0755"

- name: Render proposed Nginx configuration to a candidate, not the live file
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ yxorp_candidate_config }}"
    mode: "0644"

- name: Check whether the declared image is cached locally
  ansible.builtin.command:
    argv: [podman, image, exists, "{{ yxorp_image }}"]
  register: yxorp_image_present
  changed_when: false
  failed_when: yxorp_image_present.rc not in [0, 1]
  check_mode: false

- name: Retrieve the selected image if absent
  ansible.builtin.command:
    argv: [podman, pull, "{{ yxorp_image }}"]
  when: yxorp_image_present.rc == 1
  register: yxorp_image_pulled
  changed_when: yxorp_image_pulled.rc == 0

# Run Nginx's own parser against the candidate before copying it into
# the service's mounted live path. No production socket is bound here.
- name: Require Nginx configuration validation in a disposable container
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --network
      - host
      - --volume
      - "{{ yxorp_candidate_config }}:/etc/nginx/nginx.conf:ro,Z"
      - --entrypoint
      - /usr/sbin/nginx
      - "{{ yxorp_image }}"
      - -t
      - -c
      - /etc/nginx/nginx.conf
  register: yxorp_nginx_validation
  changed_when: false

- name: Publish validated Nginx configuration
  ansible.builtin.copy:
    src: "{{ yxorp_candidate_config }}"
    dest: "{{ yxorp_active_config }}"
    remote_src: true
    mode: "0644"
  register: yxorp_config_publish

- name: Ensure system rootful Quadlet directory exists
  ansible.builtin.file:
    path: "{{ yxorp_quadlet_dir }}"
    state: directory
    mode: "0755"

- name: Install rootful YXORP Quadlet
  ansible.builtin.template:
    src: yxorp.container.j2
    dest: "{{ yxorp_quadlet_file }}"
    mode: "0644"
  register: yxorp_quadlet_publish

- name: Start or reconcile YXORP using the system service manager
  ansible.builtin.systemd_service:
    name: "{{ yxorp_service_name }}"
    daemon_reload: "{{ yxorp_quadlet_publish.changed }}"
    # Quadlet generator processes [Install] WantedBy=multi-user.target at
    # reload/boot; enabling its generated transient service is not supported.
    # The validated nginx.conf is bind-mounted as a single host file.
    # Ansible copy replaces its inode atomically, but a running Podman
    # container can remain pinned to the old mounted inode. Reloading
    # Nginx inside that container would re-read the OLD config. Restart
    # only this owned systemd service after either the file or the
    # Quadlet changes, so Podman remounts the current file at startup.
    # With no source changes, 'started' is idempotent and does not
    # interrupt an already-running service.
    state: "{{ 'restarted' if (yxorp_quadlet_publish.changed or yxorp_config_publish.changed) else 'started' }}"

- name: Check the selected local-only management health endpoint
  ansible.builtin.uri:
    url: "http://127.0.0.1:80/__yxorp_health"
    return_content: true
    status_code: 200
    timeout: 5
  register: yxorp_health
  retries: 10
  delay: 2
  until: yxorp_health.status | default(0) == 200 and 'yxorp-ready' in (yxorp_health.content | default(''))
  changed_when: false

- name: Report stage scope and unresolved application acceptance
  ansible.builtin.debug:
    msg: >-
      YXORP {{ yxorp_deployment_scope }} accepted its generated config
      on {{ yxorp_bind_address }}:80. The local endpoint proves only
      Nginx health. A separate client probe must establish real forwarding;
      application sessions, WebSockets, fallback, DNS, and cutover are
      not established by this result.

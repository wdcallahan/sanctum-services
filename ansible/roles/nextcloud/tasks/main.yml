---
# All validation is before filesystem or service changes.
- name: Confirm target and declared network/image inputs
  ansible.builtin.assert:
    that:
      - ansible_facts['fqdn'] == inventory_hostname
      - nextcloud_host_port | int >= 1024
      - nextcloud_host_port | int <= 65535
      - nextcloud_public_hostname | length > 0
      - nextcloud_public_scheme in ['http', 'https']
      - nextcloud_postgres_host | length > 0
      - nextcloud_postgres_host is search('[A-Za-z]')
      - "'.' in nextcloud_postgres_host"
      - nextcloud_image is match('^.+@sha256:[0-9a-f]{64}$')
    fail_msg: >-
      Choose the intended service hostname, scheme, database DNS name,
      and an immutable image digest before applying this playbook.

# Host firewall publication is owned by Sanctum Maintenance. These are
# observations, not permission for Services to modify runtime/permanent state.
# Fail before creating files, touching credentials or restarting Nextcloud.
- name: Observe the active firewall zone for Kvin's service interface
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - "--get-zone-of-interface={{ nextcloud_firewall_interface }}"
  register: nextcloud_firewall_interface_zone
  changed_when: false
  failed_when: false
  check_mode: false

- name: Observe Maintenance-owned runtime admission for Nextcloud
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - "--zone={{ nextcloud_firewall_zone }}"
      - "--query-port={{ nextcloud_host_port }}/tcp"
  register: nextcloud_firewall_runtime_port
  changed_when: false
  failed_when: false
  check_mode: false

- name: Observe Maintenance-owned permanent admission for Nextcloud
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ nextcloud_firewall_zone }}"
      - "--query-port={{ nextcloud_host_port }}/tcp"
  register: nextcloud_firewall_permanent_port
  changed_when: false
  failed_when: false
  check_mode: false

- name: Require Maintenance's live and durable Nextcloud firewall prerequisite
  ansible.builtin.assert:
    that:
      - nextcloud_firewall_interface_zone.rc == 0
      - nextcloud_firewall_interface_zone.stdout | trim == nextcloud_firewall_zone
      - nextcloud_firewall_runtime_port.rc == 0
      - nextcloud_firewall_permanent_port.rc == 0
    fail_msg: >-
      Nextcloud needs Maintenance-owned {{ nextcloud_host_port }}/tcp in BOTH
      runtime and permanent firewalld state, in zone
      {{ nextcloud_firewall_zone }} on interface
      {{ nextcloud_firewall_interface }}. Observed interface-zone result={{
      nextcloud_firewall_interface_zone.stdout | default('unknown') | trim }},
      runtime query rc={{ nextcloud_firewall_runtime_port.rc | default('unknown') }},
      permanent query rc={{ nextcloud_firewall_permanent_port.rc | default('unknown') }}.
      Have Sanctum Maintenance apply its reviewed
      playbooks/configure-kvin-firewall.yml according to
      docs/runbooks/kvin-service-firewall.md after Nova's live approval;
      then rerun Services. Services does not open host firewall ports.

- name: Confirm application credentials are supplied separately
  ansible.builtin.assert:
    that:
      - vault_nextcloud_postgres_password is defined
      - (vault_nextcloud_postgres_password | default('')) | length > 0
    fail_msg: >-
      Supply nonempty vault_nextcloud_postgres_password via the existing
      database-only encrypted Ansible Vault; the human administrator creates
      their own account in the Nextcloud web installation wizard.
  no_log: true

- name: Verify the declared PostgreSQL endpoint is reachable
  ansible.builtin.wait_for:
    host: "{{ nextcloud_postgres_host }}"
    port: 5432
    connect_timeout: 3
    timeout: 10
    state: started

# Apache runs as www-data inside the container; its document root must be
# traversable. Private application data below it has its own in-container access.
- name: Create the application storage directory
  ansible.builtin.file:
    path: "{{ nextcloud_html_dir }}"
    state: directory
    mode: "0755"

- name: Create the private application configuration directory
  ansible.builtin.file:
    path: "{{ nextcloud_private_config_dir }}"
    state: directory
    mode: "0700"

- name: Create the rootless Quadlet directory
  ansible.builtin.file:
    path: "{{ nextcloud_quadlet_dir }}"
    state: directory
    mode: "0755"

# The host directory is mode 0700; the mounted single file is mode 0644
# because PHP runs as UID 33 inside the container and must read it.
# It is never placed in source control or passed in the container's environment.
- name: Install the database password as a privately scoped file
  ansible.builtin.copy:
    content: "{{ vault_nextcloud_postgres_password }}"
    dest: "{{ nextcloud_private_config_dir }}/postgresql-password"
    mode: "0644"
  no_log: true
  notify: Restart Nextcloud

# The official Nextcloud 34 browser autoconfig expects the _FILE variant for
# database name, user and password together; mixing raw DB/USER with a
# password-only _FILE leaves PostgreSQL unset in the installation wizard.
- name: Install the non-secret PostgreSQL database-name file
  ansible.builtin.copy:
    content: "{{ nextcloud_postgres_database }}"
    dest: "{{ nextcloud_private_config_dir }}/postgresql-database"
    mode: "0644"
  notify: Restart Nextcloud

- name: Install the non-secret PostgreSQL username file
  ansible.builtin.copy:
    content: "{{ nextcloud_postgres_user }}"
    dest: "{{ nextcloud_private_config_dir }}/postgresql-username"
    mode: "0644"
  notify: Restart Nextcloud

- name: Write non-secret container environment
  ansible.builtin.template:
    src: nextcloud.env.j2
    dest: "{{ nextcloud_private_config_dir }}/nextcloud.env"
    mode: "0600"
  notify: Restart Nextcloud

- name: Install Nextcloud Quadlet
  ansible.builtin.template:
    src: nextcloud.container.j2
    dest: "{{ nextcloud_quadlet_dir }}/sanctum-nextcloud.container"
    mode: "0644"
  register: nextcloud_quadlet_file
  notify: Restart Nextcloud

- name: Enable and start Nextcloud in the user service manager
  ansible.builtin.systemd_service:
    name: "{{ nextcloud_quadlet_service }}"
    scope: user
    daemon_reload: "{{ nextcloud_quadlet_file.changed }}"
    enabled: true
    state: started
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"

- name: Apply any updated container inputs before checking readiness
  ansible.builtin.meta: flush_handlers

# The first deployment deliberately stops at the web installation wizard;
# installed=false is expected until Nova creates the admin account there.
- name: Verify Nextcloud is serving its installation or installed state
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ nextcloud_host_port }}/status.php"
    return_content: true
    status_code: 200
  register: nextcloud_status
  until: >-
    nextcloud_status.status | default(0) == 200
    and nextcloud_status.json.installed is defined
  retries: 20
  delay: 5
  changed_when: false

- name: Report whether the web installer is still pending
  ansible.builtin.debug:
    msg: >-
      Nextcloud status endpoint responded; web_installer_pending={{
      not (nextcloud_status.json.installed | bool) }}.
      This is not yet an authenticated database or user-login acceptance.

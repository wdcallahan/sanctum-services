---
# Kvin is the initial managed host, not implicitly the Ansible controller.
# Use Ansible's normal default 'smart' connection (SSH for this Linux host).
# Resolve the managed host through Sanctum's authoritative name service.
# Do not pin a changing LAN address here: controllers on Kvin and Peanut
# must resolve the same managed-host name to a reachable interface.
all:
  children:
    nextcloud:
      hosts:
        kvin.outer.sanctum:
          ansible_user: wdc2
          ansible_python_interpreter: /usr/bin/python3

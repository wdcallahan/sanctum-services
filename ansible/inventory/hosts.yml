---
# Kvin is the initial managed host, not implicitly the Ansible controller.
# Use Ansible's normal default 'smart' connection (SSH for this Linux host).
# This also works when ansible-navigator runs in an EE on Kvin and SSHes
# back into Kvin, and when the controller later runs on Peanut.
all:
  children:
    nextcloud:
      hosts:
        kvin.outer.sanctum:
          ansible_user: wdc2
          ansible_python_interpreter: /usr/bin/python3

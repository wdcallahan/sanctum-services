---
# Kvin is the initial managed host, not implicitly the Ansible controller.
# Keep Ansible's smart/SSH connection, even when launched from Kvin's own EE.
# Debian's local /etc/hosts resolves its FQDN to 127.0.1.1; inside a Podman
# execution environment that loopback address does NOT identify native Kvin.
# Explicitly use Kvin's observed LAN address for transport until the shared
# name-resolution configuration provides a non-loopback result inside every EE.
# Inventory identity remains kvin.outer.sanctum for group vars and host facts.
all:
  children:
    nextcloud:
      hosts:
        kvin.outer.sanctum:
          ansible_host: 192.168.1.192
          ansible_user: wdc2
          ansible_python_interpreter: /usr/bin/python3

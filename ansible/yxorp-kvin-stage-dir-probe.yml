---
# Read-only LinkStack anonymous HTTP root comparison on Kvin.
# This explicitly tests a TEMPORARY route pointing back to old Kvar :8081;
# it is not LinkStack data migration or proof Kvar can be retired.
- name: Compare interim LinkStack route through Kvin stage and Kvar NPM
  hosts: yxorp
  gather_facts: false
  become: false
  vars_files:
    - vars/yxorp-kvin-stage.yml
    - ../data/yxorp-routes.yml
  tasks:
    - name: Require exact LinkStack Kvin stage scope and old Kvar backend only
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'kvin.outer.sanctum'
          - yxorp_deployment_scope == 'kvin_stage'
          - yxorp_kvin_stage_approved | bool
          - yxorp_stage_square_approved | bool
          - yxorp_stage_prism_approved | bool
          - yxorp_stage_search_approved | bool
          - yxorp_stage_dir_approved | bool
          - not (yxorp_production_cutover_approved | bool)
          - yxorp_routes | length == 8
          - (yxorp_routes | selectattr('enabled', 'equalto', true) | map(attribute='hostname') | list) == ['yarn.nexus.sanctum']
          - yxorp_routes[4].hostname == 'dir.nexus.sanctum'
          - not (yxorp_routes[4].enabled | bool)
          - yxorp_routes[4].upstream_scheme == 'http'
          - yxorp_routes[4].upstream_host == 'kvar.outer.sanctum'
          - yxorp_routes[4].upstream_port | int == 8081
          - not (yxorp_routes[4].websocket | bool)
        fail_msg: >-
          Only authorized Kvin stage may compare LinkStack against the
          existing Kvar backend. Production/Kvar retirement remains closed.

    - name: Request anonymous LinkStack root independently across three paths
      ansible.builtin.uri:
        url: "{{ item.url }}"
        method: GET
        headers:
          Host: dir.nexus.sanctum
        use_proxy: false
        follow_redirects: none
        return_content: false
        status_code: [200, 301, 302, 303, 307, 308, 401, 403, 404, 429, 500, 502, 503]
        timeout: 8
      loop:
        - name: direct_backend
          url: http://kvar.outer.sanctum:8081/
        - name: incumbent_kvar_npm
          url: http://kvar.outer.sanctum/
        - name: candidate_kvin_stage
          url: http://127.0.0.1:80/
      loop_control:
        label: "{{ item.name }}"
      register: yxorp_dir_stage_responses
      changed_when: false
      failed_when: false
      no_log: true

    - name: Require exact three-route comparison set without exposing responses
      ansible.builtin.assert:
        that:
          - yxorp_dir_stage_responses.results | length == 3
          - (yxorp_dir_stage_responses.results | map(attribute='item.name') | list) == ['direct_backend', 'incumbent_kvar_npm', 'candidate_kvin_stage']

    - name: Report only LinkStack HTTP status and compatibility metadata
      ansible.builtin.debug:
        msg:
          observer: "{{ inventory_hostname }}"
          frontend: dir.nexus.sanctum
          direct_backend: kvar.outer.sanctum:8081
          incumbent_npm: kvar.outer.sanctum:80
          candidate_stage: 127.0.0.1:80
          direct_status: "{{ direct.status | default(-1) }}"
          incumbent_status: "{{ incumbent.status | default(-1) }}"
          candidate_status: "{{ candidate.status | default(-1) }}"
          all_three_have_http_response: "{{ (direct.status | default(-1) | int) >= 100 and (incumbent.status | default(-1) | int) >= 100 and (candidate.status | default(-1) | int) >= 100 }}"
          candidate_and_incumbent_status_equal: "{{ candidate.status | default(-1) == incumbent.status | default(-1) }}"
          candidate_and_direct_status_equal: "{{ candidate.status | default(-1) == direct.status | default(-1) }}"
          candidate_content_type_equals_incumbent: "{{ (candidate.content_type | default('')) == (incumbent.content_type | default('')) if (candidate.status | default(-1) | int) >= 100 and (incumbent.status | default(-1) | int) >= 100 else 'not_comparable' }}"
          incumbent_redirect_present: "{{ incumbent.location | default('') | length > 0 }}"
          candidate_redirect_present: "{{ candidate.location | default('') | length > 0 }}"
          candidate_redirect_equals_incumbent: "{{ candidate.location | default('') == incumbent.location | default('') if (candidate.status | default(-1) | int) >= 300 and (candidate.status | default(-1) | int) < 400 and (incumbent.status | default(-1) | int) >= 300 and (incumbent.status | default(-1) | int) < 400 else 'not_comparable' }}"
          application_migrated_to_kvin: false
          configuration_changed: false
          limitation: >-
            GET / compatibility with old Kvar backend only. LinkStack's
            intended Kvin restore, persistent data, user sessions,
            links/assets, DNS, external LAN access and cutover are untested.
      vars:
        direct: "{{ yxorp_dir_stage_responses.results[0] }}"
        incumbent: "{{ yxorp_dir_stage_responses.results[1] }}"
        candidate: "{{ yxorp_dir_stage_responses.results[2] }}"

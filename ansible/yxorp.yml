---
# Source-managed production YXORP on Kvin: promote exactly the eight
# already accepted frontend names, leaving the historical staging data
# unchanged. Requires separately authorized stage-to-production handoff.
# Maintenance owns inbound TCP80 admission and authoritative DNS.
- name: Reconcile production Sanctum YXORP on Kvin
  hosts: yxorp
  gather_facts: true
  become: true
  vars_files:
    - ../data/yxorp-routes.yml
  vars:
    yxorp_production_expected_names:
      - yarn.nexus.sanctum
      - square.nexus.sanctum
      - joule.nexus.sanctum
      - search.nexus.sanctum
      - dir.nexus.sanctum
      - kuma.nexus.sanctum
      - pihole.nexus.sanctum
      - yarn.inner.sanctum
    yxorp_production_routes: []
    yxorp_production_kuma_http: http://127.0.0.1:13001/
  pre_tasks:
    - name: Require explicitly approved exact production YXORP handoff
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'kvin.outer.sanctum'
          - ansible_facts['fqdn'] == inventory_hostname
          - ansible_facts['architecture'] == 'aarch64'
          - not ansible_check_mode
          - yxorp_deployment_scope == 'kvin_production'
          - yxorp_production_cutover_approved | bool
          - yxorp_image == 'docker.io/library/nginx@sha256:564a09935b00f058ca1b28c742169ba817499baa0479807bf7f373fe2804fbf7'
          - yxorp_host_port | int == 80
          - yxorp_bind_address == '0.0.0.0'
          - yxorp_routes | length == 8
          - yxorp_routes | map(attribute='hostname') | list | sort == yxorp_production_expected_names | sort
        fail_msg: >-
          Production deployment requires exact Kvin, the reviewed eight
          original route entries and explicit authorization; it never
          rewrites DNS/firewall or the incumbent Kvar proxy.

    - name: Verify legacy Kuma route is still the known Kvar stage origin
      ansible.builtin.assert:
        that:
          - item.upstream_host == 'kvar.outer.sanctum'
          - item.upstream_port | int == 3001
          - item.websocket | bool
        fail_msg: Refuse silent Kuma backend changes in staging manifest.
      loop: "{{ yxorp_routes | selectattr('hostname', 'equalto', 'kuma.nexus.sanctum') | list }}"

    - name: Observe stage Quadlet without following links
      ansible.builtin.stat:
        path: /etc/containers/systemd/sanctum-yxorp-kvin-stage.container
        follow: false
      register: yxorp_production_stage_quadlet

    - name: Observe old rootful stage service before acquiring port 80
      ansible.builtin.command:
        argv: [systemctl, is-active, sanctum-yxorp-kvin-stage.service]
      register: yxorp_production_stage_unit
      changed_when: false
      failed_when: false

    - name: Require old Kvin port-80 stage already removed with its own runbook
      ansible.builtin.assert:
        that:
          - not (yxorp_production_stage_quadlet.stat.exists | default(false))
          - yxorp_production_stage_unit.rc != 0
        fail_msg: >-
          Remove only the owned YXORP Kvin stage with its guarded
          stage-removal playbook before deploying the production Quadlet.
          Never start two rootful Nginx services competing for port 80.

    - name: Require new retained Kuma actually responds on its private Kvin listener
      ansible.builtin.uri:
        url: "{{ yxorp_production_kuma_http }}"
        use_proxy: false
        follow_redirects: none
        status_code: [200, 302]
        timeout: 6
      register: yxorp_production_kuma_http_response
      changed_when: false

    - name: Render exactly eight production routes with only Kuma retargeted
      ansible.builtin.set_fact:
        yxorp_production_routes: >-
          {{ yxorp_production_routes +
             [item | combine({'enabled': true}) |
              combine({'upstream_host': '127.0.0.1', 'upstream_port': 13001}
                      if item.hostname == 'kuma.nexus.sanctum'
                      else {})] }}
      loop: "{{ yxorp_routes }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Assert all eight production vhosts and no other backend retargets
      ansible.builtin.assert:
        that:
          - yxorp_production_routes | length == 8
          - yxorp_production_routes | selectattr('enabled', 'equalto', true) | list | length == 8
          - yxorp_production_routes | selectattr('hostname', 'equalto', 'kuma.nexus.sanctum') | map(attribute='upstream_host') | list == ['127.0.0.1']
          - yxorp_production_routes | selectattr('hostname', 'equalto', 'kuma.nexus.sanctum') | map(attribute='upstream_port') | list == [13001]
        fail_msg: Refuse a partial route publication or unreviewed Kuma origin.

    - name: Promote verified full production manifest for the existing YXORP role
      ansible.builtin.set_fact:
        yxorp_routes: "{{ yxorp_production_routes }}"

  roles:
    - yxorp

---
# Eventual production YXORP on Kvin, rootful HTTP:80 on all interfaces.
# Not authorized until the separate Kvar cutover gate is deliberately accepted.
# This never changes host firewall, DNS, or Kvar NPM itself.
- name: Reconcile production Sanctum YXORP on Kvin
  hosts: yxorp
  gather_facts: true
  become: true
  vars_files:
    - ../data/yxorp-routes.yml
  roles:
    - yxorp

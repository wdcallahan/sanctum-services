---
# Source-managed production YXORP on Kvin: promote exactly the eight
# already accepted frontend names, leaving the historical staging data
# unchanged. Requires separately authorized stage-to-production handoff.
# Maintenance owns inbound TCP80 admission and authoritative DNS.
- name: Reconcile production Sanctum YXORP on Kvin
  hosts: yxorp
  gather_facts: true
  become: true
  vars_files:
    - ../data/yxorp-routes.yml
  vars:
    yxorp_production_expected_names:
      - yarn.nexus.sanctum
      - square.nexus.sanctum
      - joule.nexus.sanctum
      - search.nexus.sanctum
      - dir.nexus.sanctum
      - kuma.nexus.sanctum
      - pihole.nexus.sanctum
      - yarn.inner.sanctum
    yxorp_production_routes: []
    yxorp_production_kuma_http: http://127.0.0.1:13001/
    # Desired production LinkStack; override to 'kvar' only for rollback.
    yxorp_production_linkstack_backend: kvin
  pre_tasks:
    - name: Require explicitly approved exact production YXORP handoff
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'kvin.outer.sanctum'
          - ansible_facts['fqdn'] == inventory_hostname
          - ansible_facts['architecture'] == 'aarch64'
          - not ansible_check_mode
          - yxorp_deployment_scope == 'kvin_production'
          - yxorp_production_cutover_approved | bool
          - yxorp_image == 'docker.io/library/nginx@sha256:564a09935b00f058ca1b28c742169ba817499baa0479807bf7f373fe2804fbf7'
          - yxorp_host_port | int == 80
          - yxorp_bind_address == '0.0.0.0'
          - yxorp_routes | length == 8
          - yxorp_production_linkstack_backend in ['kvin', 'kvar']
          - (yxorp_routes | map(attribute='hostname') | list | sort) == (yxorp_production_expected_names | sort)
        fail_msg: >-
          Production deployment requires exact Kvin, the reviewed eight
          original route entries and explicit authorization; it never
          rewrites DNS/firewall or the incumbent Kvar proxy.

    - name: Verify legacy Kuma route is still the known Kvar stage origin
      ansible.builtin.assert:
        that:
          - item.upstream_host == 'kvar.outer.sanctum'
          - item.upstream_port | int == 3001
          - item.websocket | bool
        fail_msg: Refuse silent Kuma backend changes in staging manifest.
      loop: "{{ yxorp_routes | selectattr('hostname', 'equalto', 'kuma.nexus.sanctum') | list }}"

    - name: Verify the legacy LinkStack source entry is still Kvar for rollback
      ansible.builtin.assert:
        that:
          - item.upstream_host == 'kvar.outer.sanctum'
          - item.upstream_port | int == 8081
          - not (item.websocket | bool)
        fail_msg: Refuse changed Kvar LinkStack fallback origin.
      loop: "{{ yxorp_routes | selectattr('hostname', 'equalto', 'dir.nexus.sanctum') | list }}"

    - name: Observe stage Quadlet without following links
      ansible.builtin.stat:
        path: /etc/containers/systemd/sanctum-yxorp-kvin-stage.container
        follow: false
      register: yxorp_production_stage_quadlet

    - name: Observe old rootful stage service before acquiring port 80
      ansible.builtin.command:
        argv: [systemctl, is-active, sanctum-yxorp-kvin-stage.service]
      register: yxorp_production_stage_unit
      changed_when: false
      failed_when: false

    - name: Require old Kvin port-80 stage already removed with its own runbook
      ansible.builtin.assert:
        that:
          - not (yxorp_production_stage_quadlet.stat.exists | default(false))
          - yxorp_production_stage_unit.rc != 0
        fail_msg: >-
          Remove only the owned YXORP Kvin stage with its guarded
          stage-removal playbook before deploying the production Quadlet.
          Never start two rootful Nginx services competing for port 80.

    - name: Require new retained Kuma actually responds on its private Kvin listener
      ansible.builtin.uri:
        url: "{{ yxorp_production_kuma_http }}"
        use_proxy: false
        follow_redirects: none
        status_code: [200, 302]
        timeout: 6
      register: yxorp_production_kuma_http_response
      changed_when: false

    - name: Require current Kvin LinkStack responds before selecting it for production
      ansible.builtin.uri:
        url: http://127.0.0.1:18081/
        headers:
          Host: dir.nexus.sanctum
        use_proxy: false
        follow_redirects: none
        status_code: [200]
        timeout: 8
      changed_when: false
      when: yxorp_production_linkstack_backend == 'kvin'

    - name: Render exactly eight production routes with Kuma and selected LinkStack backends
      ansible.builtin.set_fact:
        yxorp_production_routes: >-
          {{ yxorp_production_routes +
             [item | combine({'enabled': true}) |
              combine({'upstream_host': '127.0.0.1', 'upstream_port': 13001}
                      if item.hostname == 'kuma.nexus.sanctum'
                      else {}) |
              combine({'upstream_host': ('127.0.0.1' if yxorp_production_linkstack_backend == 'kvin' else 'kvar.outer.sanctum'),
                       'upstream_port': (18081 if yxorp_production_linkstack_backend == 'kvin' else 8081)}
                      if item.hostname == 'dir.nexus.sanctum'
                      else {})] }}
      loop: "{{ yxorp_routes }}"
      loop_control:
        label: "{{ item.hostname }}"

    - name: Assert eight production vhosts and exact Kuma and LinkStack destinations
      ansible.builtin.assert:
        that:
          - yxorp_production_routes | length == 8
          - yxorp_production_routes | selectattr('enabled', 'equalto', true) | list | length == 8
          - yxorp_production_routes | selectattr('hostname', 'equalto', 'kuma.nexus.sanctum') | map(attribute='upstream_host') | list == ['127.0.0.1']
          - yxorp_production_routes | selectattr('hostname', 'equalto', 'kuma.nexus.sanctum') | map(attribute='upstream_port') | list == [13001]
          - yxorp_production_routes | selectattr('hostname', 'equalto', 'dir.nexus.sanctum') | map(attribute='upstream_host') | list == [('127.0.0.1' if yxorp_production_linkstack_backend == 'kvin' else 'kvar.outer.sanctum')]
          - yxorp_production_routes | selectattr('hostname', 'equalto', 'dir.nexus.sanctum') | map(attribute='upstream_port') | list == [(18081 if yxorp_production_linkstack_backend == 'kvin' else 8081)]
        fail_msg: Refuse a partial route publication or unreviewed Kuma origin.

    - name: Promote verified full production manifest for the existing YXORP role
      ansible.builtin.set_fact:
        yxorp_routes: "{{ yxorp_production_routes }}"

  roles:
    - yxorp

  post_tasks:
    - name: Verify production proxy actually reaches source-owned Kvin Kuma
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: kuma.nexus.sanctum
        use_proxy: false
        follow_redirects: none
        status_code: [200, 302]
        timeout: 8
      register: yxorp_production_kuma_frontend
      changed_when: false
      no_log: true

    - name: Observe existing Yarn route without blocking unrelated service updates
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: yarn.nexus.sanctum
        use_proxy: false
        follow_redirects: none
        status_code: [200]
        timeout: 8
      register: yxorp_production_yarn_frontend
      changed_when: false
      failed_when: false
      no_log: true

    - name: Verify normal production LinkStack route responds through YXORP
      ansible.builtin.uri:
        url: http://127.0.0.1/
        headers:
          Host: dir.nexus.sanctum
        use_proxy: false
        follow_redirects: none
        status_code: [200]
        timeout: 8
      register: yxorp_production_linkstack_frontend
      changed_when: false
      no_log: true

    - name: Report bounded Kvin YXORP production listener readiness
      ansible.builtin.debug:
        msg:
          observer: "{{ inventory_hostname }}"
          production_service: sanctum-yxorp.service
          produced_route_count: "{{ yxorp_routes | length }}"
          kuma_target: 127.0.0.1:13001
          linkstack_target: "{{ '127.0.0.1:18081' if yxorp_production_linkstack_backend == 'kvin' else 'kvar.outer.sanctum:8081' }}"
          linkstack_frontend_http_response: "{{ yxorp_production_linkstack_frontend.status | int }}"
          kuma_frontend_http_response: "{{ yxorp_production_kuma_frontend.status | int }}"
          yarn_frontend_http_response: "{{ yxorp_production_yarn_frontend.status | default(-1) | int }}"
          yarn_frontend_accepted: "{{ (yxorp_production_yarn_frontend.status | default(-1) | int) == 200 }}"
          yarn_frontend_note: "{{ 'responded' if (yxorp_production_yarn_frontend.status | default(-1) | int) == 200 else 'preexisting Yarn path not responding; check separately, not a deployment failure' }}"
          local_production_listener_accepted: true
          kvars_existing_npm_changed: false
          dns_changed: false
          firewall_changed: false
          real_named_lan_client_accepted: false
          websocket_sessions_accepted: false
          next_gate: Real Firefox dir.nexus.sanctum login and public directory; revert only LinkStack backend if needed

---
# The old November 11 digest is historical qualification evidence, NOT
# permanent production policy. Supported Kuma 2 moving registry tag (upstream
# uses :latest for v1); user Podman auto-update timer is already enabled.
kuma_image: "docker.io/louislam/uptime-kuma:2"
# Explicit operator decision is required even for the isolated staged copy.
kuma_stage_approved: false
kuma_bind_address: "127.0.0.1"
kuma_host_port: 13001
kuma_data_volume: sanctum-kuma-data
# Uptime Kuma v2 officially supports UPTIME_KUMA_DB_TYPE=sqlite.
# A local Podman volume avoids remote database dependencies during recovery.
kuma_db_type: sqlite

---
# Kvin is the eventual full-LAN production listener. No loopback/special port.
# The original 2026-11-09 ARM64 digest was tested as migration evidence.
# It is not a permanent production release selection.
# Production follows nginx:stable-alpine with registry auto-update instead of
# freezing the 2026-11-09 recovery test image forever.
yxorp_deployment_scope: kvin_production
yxorp_image: "docker.io/library/nginx:stable-alpine"
yxorp_bind_address: "0.0.0.0"
yxorp_host_port: 80
# Nobody authorized replacing Kvar's currently operating proxy or DNS route.
yxorp_production_cutover_approved: false

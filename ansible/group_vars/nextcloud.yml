---
# Intended family-facing service URL through YXORP; DNS and proxy route are not yet deployed.
# The public name remains stable across moves of the backend host and port.
nextcloud_public_hostname: "square.nexus.sanctum"
# YXORP currently has no trusted certificate for the internal service name.
# This is an explicitly HTTP-only initial route; revisit when private TLS is ready.
nextcloud_public_scheme: "http"

# Maintenance confirmed the app-facing service DNS name on October 19, 2026.
# db1 names Kvin; db follows the chosen writable primary (no HA assumed yet).
nextcloud_postgres_host: "db.nexus.sanctum"

# Original native-qualified frozen image, retained ONLY for the first
# guarded image-policy migration and source drift checks. Never silently revert
# working Nextcloud data from a newer image by changing back to this digest.
nextcloud_original_frozen_image: "docker.io/library/nextcloud@sha256:bcf8db2ebb4c5365f8ac8ca89d3857efecd88df68147353fbfe019b6dc888145"
# Desired official within-34 maintenance channel. This is source intent only;
# production still runs the original frozen image until a protected promotion.
# No uncoordinated Podman registry auto-update: the Services cycle must back up
# current HTML + Nextcloud-only PG and verify Peanut custody FIRST.
nextcloud_image: "docker.io/library/nextcloud:34.0-apache"
# Flip ONLY after real isolated PostgreSQL and running Nextcloud application
# restore (login, Calendar and files) is accepted. Source-only intent is not proof.
nextcloud_complete_restore_qualified_in_source: false

nextcloud_host_port: 8085
# Read-only prerequisite expectations, matching the Maintenance-owned Kvin
# host policy. Services never opens these ports or installs rich rules.
nextcloud_firewall_zone: "public"
nextcloud_firewall_interface: "eth0"
nextcloud_postgres_database: nextcloud
nextcloud_postgres_user: nextcloud
# The human administrator account is created in the web installer, not supplied
# as an Ansible variable. Its password belongs to Nova's Bitwarden.
# vault_nextcloud_postgres_password is supplied only by the existing private
# database-only Vault file at ~/.config/sanctum-services/secrets/ on Kvin.

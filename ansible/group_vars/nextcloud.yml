---
# Intended family-facing service URL through YXORP; DNS and proxy route are not yet deployed.
# The public name remains stable across moves of the backend host and port.
nextcloud_public_hostname: "square.nexus.sanctum"
nextcloud_public_scheme: "https"

# Maintenance confirmed the app-facing service DNS name on October 19, 2026.
# db1 names Kvin; db follows the chosen writable primary (no HA assumed yet).
nextcloud_postgres_host: "db.nexus.sanctum"

# Kvin pull/inspect on October 18 confirmed linux/arm64 for Nextcloud 34.0.5-apache.
# Pin the observed registry manifest digest rather than a mutable tag.
# Image availability and application startup still require deployment qualification.
nextcloud_image: "docker.io/library/nextcloud@sha256:bcf8db2ebb4c5365f8ac8ca89d3857efecd88df68147353fbfe019b6dc888145"

nextcloud_host_port: 8085
nextcloud_postgres_database: nextcloud
nextcloud_postgres_user: nextcloud
nextcloud_admin_user: admin

# Values beginning vault_ are supplied by an encrypted
# ansible/group_vars/nextcloud/vault.yml (not yet created).

            (linkstack_trial_http.stdout | trim) in ['200', '301', '302', '303', '307', '308']
          no_log: true

        - name: Require real HTTP from restored isolated application
          ansible.builtin.assert:
            that:
              - linkstack_trial_http.rc == 0
              - (linkstack_trial_http.stdout | trim) in ['200', '301', '302', '303', '307', '308']
            fail_msg: Offline restored LinkStack did not serve an accepted HTTP status.
      always:
        - name: Remove only the newly created disposable trial container
          ansible.builtin.command:
            argv: [podman, rm, --force, "{{ linkstack_trial_container }}"]
          when: >-
            linkstack_trial_started is defined and
            (linkstack_trial_started.rc | default(1)) == 0
          register: linkstack_trial_cleanup
          changed_when: linkstack_trial_cleanup.rc | default(1) == 0
          no_log: true

    - name: Require successful cleanup of the single offline trial container
      ansible.builtin.assert:
        that:
          - linkstack_trial_cleanup is defined
          - (linkstack_trial_cleanup.rc | default(1)) == 0

    - name: Report bounded LinkStack ARM64 image and offline restored-application acceptance
      ansible.builtin.debug:
        msg:
          receiver: kvin.outer.sanctum
          candidate_image: "{{ linkstack_candidate.image }}"
          source_image_id_matched: true
          native_architecture: linux/arm64
          php_runtime_executed: true
          offline_restored_linkstack_started: true
          offline_restored_http_status: "{{ linkstack_trial_http.stdout | trim }}"
          temporary_container_removed: true
          isolated_restored_volume_retained: true
          existing_kvin_service_or_volume_changed: false
          kvar_source_or_services_changed: false
          production_proxy_dns_or_firewall_changed: false
          live_client_directory_or_admin_accepted: false
          independent_disaster_recovery_backup_accepted: false
          next_gate: source-manage Kvin rootless production candidate and test named directory client before retargeting YXORP
)
        fail_msg: >-
          This allows only a pinned LinkStack image pull and disposable network-none
          trial against the exact already-restored Kvin volume; not production.

    - name: Require only the exact isolated imported test volume already exists
      ansible.builtin.command:
        argv: [podman, volume, exists, "{{ linkstack_trial_volume }}"]
      register: linkstack_trial_volume_present
      changed_when: false
      failed_when: linkstack_trial_volume_present.rc not in [0, 1]

    - name: Refuse any missing or nonisolated LinkStack state volume
      ansible.builtin.assert:
        that:
          - linkstack_trial_volume_present.rc == 0

    - name: Obtain exact restored rootless volume mountpoint privately
      ansible.builtin.command:
        argv:
          - podman
          - volume
          - inspect
          - --format
          - "{{ '{{.Mountpoint}}' }}"
          - "{{ linkstack_trial_volume }}"
      register: linkstack_trial_mountpoint
      changed_when: false
      no_log: true


      ansible.builtin.assert:
        that:
          - (linkstack_candidate_image_inspect.stdout | from_json | length) == 1
          - (linkstack_candidate_image_inspect.stdout | from_json)[0].Architecture == 'arm64'
          - (linkstack_candidate_image_inspect.stdout | from_json)[0].Os == 'linux'
          - (linkstack_candidate_image_inspect.stdout | from_json)[0].Id == linkstack_candidate.source_running_image_id
          - (linkstack_candidate_image_inspect.stdout | from_json)[0].Id is match('^[a-f0-9]{64}$')

      no_log: true

    - name: Inspect exactly the pinned cached image without printing container settings
      ansible.builtin.command:
        argv: [podman, image, inspect, "{{ linkstack_candidate.image }}"]
      register: linkstack_candidate_image_inspect
      changed_when: false
      no_log: true


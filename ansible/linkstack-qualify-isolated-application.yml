      ansible.builtin.assert:
        that:
          - linkstack_trial_container_present.rc == 1

    - name: Observe whether pinned Linux ARM64 image is already in Kvin rootless cache
      ansible.builtin.command:
        argv: [podman, image, exists, "{{ linkstack_candidate.image }}"]
      register: linkstack_image_present
      changed_when: false

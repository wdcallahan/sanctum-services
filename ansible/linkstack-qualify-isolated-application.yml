      ansible.builtin.assert:
        that:
          - (linkstack_candidate_image_inspect.stdout | from_json | length) == 1
          - (linkstack_candidate_image_inspect.stdout | from_json)[0].Architecture == 'arm64'
          - (linkstack_candidate_image_inspect.stdout | from_json)[0].Os == 'linux'
          - (linkstack_candidate_image_inspect.stdout | from_json)[0].Id == linkstack_candidate.source_running_image_id
          - (linkstack_candidate_image_inspect.stdout | from_json)[0].Id is match('^[a-f0-9]{64}$')
        fail_msg: >-
          Digest did not resolve to the accepted original Kvar arm64 image ID.
          Do not run a different release against restored personal data.

    - name: Verify actual PHP 8.3 executes in a disposable offline image-only container
      ansible.builtin.command:
        argv:
          - podman
          - run
          - --rm
          - --network
          - none
          - --read-only
          - --security-opt
          - no-new-privileges
          - --pull
          - never
          - --entrypoint
          - /usr/bin/php83
          - "{{ linkstack_candidate.image }}"
          - --version
      register: linkstack_php_runtime
      changed_when: false
      no_log: true

    - name: Require PHP runtime launched without staging or touching app volumes
      ansible.builtin.assert:
        that:
          - linkstack_php_runtime.rc == 0
          - linkstack_php_runtime.stdout is search('PHP 8[.]3[.]')
        fail_msg: The exact image exists but its PHP runtime was not accepted.

    - name: Boot only disposable LinkStack with network disabled and no host ports
      block:
        - name: Start an isolated restored-app trial container without publishing a port
          ansible.builtin.command:
            argv:
              - podman
              - run
              - --detach
              - --name
              - "{{ linkstack_trial_container }}"
              - --network
              - none
              - --security-opt
              - no-new-privileges
              - --pull
              - never
              - --volume
              - "{{ linkstack_trial_volume }}:/htdocs"
              - --env
              - HTTP_SERVER_NAME=localhost
              - "{{ linkstack_candidate.image }}"
          register: linkstack_trial_started
          changed_when: linkstack_trial_started.rc == 0
          no_log: true

        - name: Observe application HTTP response inside the network-none namespace
          ansible.builtin.command:
            argv:
              - podman
              - exec
              - "{{ linkstack_trial_container }}"

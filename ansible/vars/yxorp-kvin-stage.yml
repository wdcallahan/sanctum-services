---
# A distinct, removable Kvin HTTP:80 stage. This is NOT production approval.
# Play vars_file overrides group_vars/yxorp.yml only for the stage play.
# No DNS change, host firewall mutation, or Kvar NPM operation occurs.
yxorp_deployment_scope: kvin_stage
yxorp_kvin_stage_approved: false
yxorp_kvin_stage_remove_approved: false
# Optional *stage-only* Square/Nextcloud trial. Does not edit desired route manifest.
yxorp_stage_square_approved: false
# Prism stage-only opt-in, only after already accepted Square remains selected.
yxorp_stage_prism_approved: false
# Search/SearXNG canary is opt-in and depends on all three prior stage routes.
yxorp_stage_search_approved: false
# Legacy LinkStack Kvar backend is an interim proxy canary, NOT Kvin restore.
yxorp_stage_dir_approved: false
# Interim Kuma :3001 on Kvar; NOT a Kvin app/data restore.
yxorp_stage_kuma_approved: false
# Pi-hole UI on old Kvar :82; stage compatibility only, NOT data migration.
yxorp_stage_pihole_approved: false
yxorp_production_cutover_approved: false
yxorp_image: "docker.io/library/nginx@sha256:564a09935b00f058ca1b28c742169ba817499baa0479807bf7f373fe2804fbf7"
yxorp_bind_address: "0.0.0.0"
yxorp_host_port: 80

# Deliberately disjoint from production's /etc/sanctum-services/yxorp and
# /etc/containers/systemd/sanctum-yxorp.container. The two cannot run
# simultaneously because they both bind the real host TCP/80.
yxorp_config_dir: /etc/sanctum-services/yxorp-kvin-stage
yxorp_candidate_config: "{{ yxorp_config_dir }}/nginx.conf.candidate"
yxorp_active_config: "{{ yxorp_config_dir }}/nginx.conf"
yxorp_quadlet_dir: /etc/containers/systemd
yxorp_quadlet_file: "{{ yxorp_quadlet_dir }}/sanctum-yxorp-kvin-stage.container"
yxorp_service_name: sanctum-yxorp-kvin-stage.service
yxorp_container_name: sanctum-yxorp-kvin-stage

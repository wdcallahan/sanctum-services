---
# Read-only Kvin staging smoke: only useful once a loopback stage is approved
# and installed. This checks actual HTTP from Kvin, NOT full client parity.
- name: Verify isolated YXORP loopback listener and Yarn forwarding
  hosts: yxorp
  gather_facts: false
  become: false
  tasks:
    - name: Check YXORP management health from Kvin's own network namespace
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/__yxorp_health
        use_proxy: false
        return_content: true
        status_code: [200]
        timeout: 5
      register: stage_health
      changed_when: false

    - name: Require an actual body from the staged listener
      ansible.builtin.assert:
        that:
          - "'yxorp-ready' in stage_health.content"

    - name: Request the actual Yarn hostname through the isolated listener
      ansible.builtin.uri:
        url: http://127.0.0.1:18080/
        headers:
          Host: yarn.nexus.sanctum
        use_proxy: false
        follow_redirects: none
        return_content: false
        status_code: [200, 201, 202, 204, 301, 302, 303, 307, 308, 401, 403]
        timeout: 10
      register: stage_yarn
      changed_when: false

    - name: Report scoped HTTP smoke only
      ansible.builtin.debug:
        msg:
          isolated_listener_healthy: true
          yarn_status: "{{ stage_yarn.status }}"
          yarn_http_response_observed: true
          limitation: >-
            This proves an HTTP response for the Yarn host from Kvin only.
            It does not prove browser UI, authentication, correct content,
            external client reachability, DNS cutover, or a working Prism
            WebSocket. Those remain separate application acceptance checks.

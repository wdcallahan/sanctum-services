---
# One-time *post-promotion* review for the accepted Nov 22 recovery point.
# The protected 34.0.6 activation already happened. NEVER rerun upgrade,
# re-backup, modify Nextcloud data, or remove backup artifacts here.
# The sole permitted mutation is deletion of the exact prior failure latch,
# after independently reading the actual running service and Calendar state.
- name: Accept already-running Nextcloud 34.0.6 and release failed-update latch
  hosts: nextcloud
  gather_facts: true
  become: false
  vars_files:
    - group_vars/nextcloud.yml
  vars:
    nextcloud_review_recovery_id: nextcloud-20261122t164508
    nextcloud_review_expected_version: "34.0.6.2"
    nextcloud_review_app_image: docker.io/library/nextcloud:34.0-apache
    nextcloud_review_halt: /home/wdc2/.local/share/sanctum-services/backups/nextcloud/.update-halted
    nextcloud_review_bundle: "/home/wdc2/.local/share/sanctum-services/backups/nextcloud/{{ nextcloud_review_recovery_id }}"
    nextcloud_review_quadlet: /home/wdc2/.config/containers/systemd/sanctum-nextcloud.container
    nextcloud_review_mount_sources:
      - /home/wdc2/srv/sanctum-services/nextcloud/html
      - /home/wdc2/.config/sanctum-services/nextcloud/postgresql-password
      - /home/wdc2/.config/sanctum-services/nextcloud/postgresql-database
      - /home/wdc2/.config/sanctum-services/nextcloud/postgresql-username
    nextcloud_review_mount_destinations:
      - /var/www/html
      - /run/secrets/nextcloud-postgresql-password
      - /run/secrets/nextcloud-postgresql-database
      - /run/secrets/nextcloud-postgresql-username
  tasks:
    - name: Require exact authorized post-failure Kvin acceptance scope
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'kvin.outer.sanctum'
          - ansible_facts['fqdn'] == inventory_hostname
          - ansible_facts['user_id'] == 'wdc2'
          - ansible_user == 'wdc2'
          - ansible_facts['architecture'] == 'aarch64'
          - not ansible_check_mode
          - nextcloud_post_promotion_accept_approved | default(false) | bool
          - nextcloud_complete_restore_qualified_in_source | bool
          - nextcloud_image == nextcloud_review_app_image
        fail_msg: Only the known protected 34.0.6 promotion on Kvin may release its latch.

    - name: Observe the failure latch and retained Kvin recovery manifest without following links
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      loop:
        - "{{ nextcloud_review_halt }}"
        - "{{ nextcloud_review_bundle }}/manifest.json"
      register: review_protected

    - name: Require the specific existing halt and recovery point before reviewing
      ansible.builtin.assert:
        that:
          - review_protected.results[0].stat.isreg | default(false)
          - review_protected.results[0].stat.mode == '0600'
          - review_protected.results[0].stat.pw_name == 'wdc2'
          - review_protected.results[1].stat.isreg | default(false)
          - review_protected.results[1].stat.mode == '0600'
        fail_msg: No matching active failure latch or retained pre-update recovery point; never invent or delete one.

    - name: Read the active halt marker without exposing source contents
      ansible.builtin.slurp:
        src: "{{ nextcloud_review_halt }}"
      register: review_halt_contents
      no_log: true

    - name: Require latch identifies only the protected November 22 promotion
      ansible.builtin.assert:
        that:
          - "'Recovery point: nextcloud-20261122t164508' in (review_halt_contents.content | b64decode)"
          - "'Nextcloud update failed after promotion attempt.' in (review_halt_contents.content | b64decode)"
        fail_msg: Unrelated update failure marker detected; preserve it and investigate separately.

    - name: Read installed production Quadlet without revealing private service environment
      ansible.builtin.slurp:
        src: "{{ nextcloud_review_quadlet }}"
      register: review_quadlet
      no_log: true

    - name: Require the managed moving-channel Quadlet and unchanged persistent mounts
      ansible.builtin.assert:
        that:
          - "'Image=docker.io/library/nextcloud:34.0-apache' in (review_quadlet.content | b64decode).splitlines()"
          - "'Pull=never' in (review_quadlet.content | b64decode).splitlines()"
          - "'AutoUpdate=registry' not in (review_quadlet.content | b64decode).splitlines()"
          - "'ContainerName=sanctum-nextcloud' in (review_quadlet.content | b64decode).splitlines()"
          - "'PublishPort=0.0.0.0:8085:80/tcp' in (review_quadlet.content | b64decode).splitlines()"
          - "(review_quadlet.content | b64decode).splitlines() | select('match', '^Volume=') | list | length == 4"
        fail_msg: Managed Quadlet source differs from the approved post-update service.

    - name: Observe normal rootless Nextcloud service state
      ansible.builtin.command:
        argv: [systemctl, --user, is-active, sanctum-nextcloud.service]
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
      register: review_systemd
      changed_when: false

    - name: Require original Nextcloud user service stays active
      ansible.builtin.assert:
        that:
          - review_systemd.rc == 0
          - review_systemd.stdout | trim == 'active'

    - name: Inspect live container and same-series cached runtime without exposing environment
      ansible.builtin.command:
        argv: "{{ item }}"
      loop:
        - [podman, container, inspect, sanctum-nextcloud]
        - [podman, image, inspect, "{{ nextcloud_review_app_image }}"]
      register: review_images
      changed_when: false
      no_log: true

    - name: Require running candidate image and original four persistent mounts
      ansible.builtin.assert:
        that:
          - (review_images.results[0].stdout | from_json | length) == 1
          - (review_images.results[1].stdout | from_json | length) == 1
          - (review_images.results[0].stdout | from_json)[0].State.Running | bool
          - (review_images.results[0].stdout | from_json)[0].ImageName == nextcloud_review_app_image
          - (review_images.results[0].stdout | from_json)[0].Image == (review_images.results[1].stdout | from_json)[0].Id
          - (review_images.results[1].stdout | from_json)[0].Architecture == 'arm64'
          - (review_images.results[1].stdout | from_json)[0].Os == 'linux'
          - "((review_images.results[0].stdout | from_json)[0].Mounts | map(attribute='Source') | list | sort) == (nextcloud_review_mount_sources | sort)"
          - "((review_images.results[0].stdout | from_json)[0].Mounts | map(attribute='Destination') | list | sort) == (nextcloud_review_mount_destinations | sort)"
        fail_msg: Running image or data mounts do not match the protected promotion.

    - name: Read actual installed version and migration state via OCC
      ansible.builtin.command:
        argv: [podman, exec, --user, www-data, sanctum-nextcloud, php, occ, status, --output=json]
      register: review_occ
      changed_when: false
      no_log: true

    - name: Require the actual completed 34.0.6.2 migration in normal mode
      ansible.builtin.assert:
        that:
          - (review_occ.stdout | from_json).version == nextcloud_review_expected_version
          - (review_occ.stdout | from_json).installed | bool
          - not ((review_occ.stdout | from_json).maintenance | bool)
          - not ((review_occ.stdout | from_json).needsDbUpgrade | default(false) | bool)
        fail_msg: Production application migration is not confirmed complete; retain the halt marker.

    - name: Observe current Nextcloud HTTP status with no proxy
      ansible.builtin.uri:
        url: http://127.0.0.1:8085/status.php
        use_proxy: false
        status_code: [200]
        return_content: true
        timeout: 10
      register: review_http
      changed_when: false

    - name: Require HTTP and OCC both report healthy post-update application
      ansible.builtin.assert:
        that:
          - review_http.status == 200
          - review_http.json.version == nextcloud_review_expected_version
          - review_http.json.installed | bool
          - not (review_http.json.maintenance | bool)
          - not (review_http.json.needsDbUpgrade | default(false) | bool)
        fail_msg: Post-update web endpoint is not reporting the exact healthy application version.

    - name: Read installed Calendar app state from running Nextcloud
      ansible.builtin.command:
        argv: [podman, exec, --user, www-data, sanctum-nextcloud, php, occ, app:list, --output=json]
      register: review_calendar
      changed_when: false
      no_log: true

    - name: Require existing Calendar 6.6.2 remains installed and enabled
      ansible.builtin.assert:
        that:
          - (review_calendar.stdout | from_json).enabled.calendar == '6.6.2'
        fail_msg: Calendar missing, disabled or modified after promotion; retain the halt marker.

    - name: Observe actual published rootless Nextcloud HTTP port
      ansible.builtin.command:
        argv: [podman, port, sanctum-nextcloud, 80/tcp]
      register: review_port
      changed_when: false

    - name: Require existing 8085 service publication is unchanged
      ansible.builtin.assert:
        that:
          - "'0.0.0.0:8085' in review_port.stdout"
        fail_msg: Existing intended LAN port is missing or not published on all interfaces.

    # Only after every read-only verification passes. No backup deletion,
    # app restarts, upgrade attempts, schema changes or timer operations.
    - name: Release only this accepted completed promotion's failure latch
      ansible.builtin.file:
        path: "{{ nextcloud_review_halt }}"
        state: absent
      register: review_latch_released

    - name: Verify the accepted failure latch is now absent
      ansible.builtin.stat:
        path: "{{ nextcloud_review_halt }}"
        follow: false
      register: review_halt_after

    - name: Require successful narrow latch release
      ansible.builtin.assert:
        that:
          - not (review_halt_after.stat.exists | default(false))
          - review_latch_released.changed | bool

    - name: Report native successful existing 34.0.6 promotion and latch resolution
      ansible.builtin.debug:
        msg:
          observer: kvin.outer.sanctum
          actual_internal_version: "{{ (review_occ.stdout | from_json).version }}"
          running_image: "{{ nextcloud_review_app_image }}"
          installed_active_normal_mode: true
          needs_database_upgrade: false
          calendar_version_enabled: "{{ (review_calendar.stdout | from_json).enabled.calendar }}"
          http_healthy: true
          original_persistent_mounts_preserved: true
          original_listener_preserved: true
          pre_update_protected_recovery_id: "{{ nextcloud_review_recovery_id }}"
          backup_and_peanut_custody_retained: true
          accepted_promotion_failure_latch_removed: true
          application_not_restarted_by_this_play: true
          backup_or_database_not_modified: true
          daily_maintenance_timer_not_installed_by_this_play: true
          next_action: Install the already source-managed daily update timer; do not repeat the accepted update

---
# Focused follow-up after Nov 12 accepted three-volume metadata scan.
# No repeat inventory, data transfer, service stop, image pull, or DNS edit.
- name: Classify rootless Kvar LinkStack Quadlet update and source backup space
  hosts: npm_proxy_legacy
  become: false
  gather_facts: false
  tasks:
    - name: Require exact rootless incumbent and normal observation mode
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'kvar.outer.sanctum'
          - ansible_user == 'wdc2'
          - not ansible_check_mode

    - name: Read bounded LinkStack update and storage evidence
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/../tools/observe-survivor-backup-readiness.py') }}"
          - --service
          - linkstack
      register: linkstack_backup_readiness
      changed_when: false
      no_log: true

    - name: Require sanitized LinkStack preflight contract
      ansible.builtin.assert:
        that:
          - (linkstack_backup_readiness.stdout | from_json).observer == 'kvar.outer.sanctum'
          - (linkstack_backup_readiness.stdout | from_json).service == 'linkstack'
          - (linkstack_backup_readiness.stdout | from_json).status in ['observed', 'partial']
          - not ((linkstack_backup_readiness.stdout | from_json).configuration_changed | bool)
          - not ((linkstack_backup_readiness.stdout | from_json).application_interrupted | bool)
          - not ((linkstack_backup_readiness.stdout | from_json).app_content_or_password_returned | bool)
          - not ((linkstack_backup_readiness.stdout | from_json).data_exported | bool)
          - not ((linkstack_backup_readiness.stdout | from_json).backup_or_restore_accepted | bool)

    - name: Report Kvar rootless LinkStack backup readiness
      ansible.builtin.debug:
        msg: "{{ linkstack_backup_readiness.stdout | from_json }}"


---
# Removable real HTTP:80 Kvin stage, subject to explicit operator approval.
# Deliberately separate from
# Kvin's production Quadlet and production cutover flag. This file never
# opens a firewall rule, rewrites DNS, or touches incumbent Kvar NPM.
- name: Validate and install only a removable Kvin YXORP HTTP 80 stage
  hosts: yxorp
  gather_facts: true
  become: true
  vars_files:
    - ../data/yxorp-routes.yml
    - vars/yxorp-kvin-stage.yml
  pre_tasks:
    - name: Require exact Kvin stage authorization before any host changes
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'kvin.outer.sanctum'
          - ansible_facts['fqdn'] == inventory_hostname
          - yxorp_deployment_scope == 'kvin_stage'
          - yxorp_kvin_stage_approved | bool
          - not (yxorp_production_cutover_approved | bool)
          - not ansible_check_mode
          - yxorp_bind_address == '0.0.0.0'
          - yxorp_host_port | int == 80
          - yxorp_config_dir == '/etc/sanctum-services/yxorp-kvin-stage'
          - yxorp_quadlet_file == '/etc/containers/systemd/sanctum-yxorp-kvin-stage.container'
          - yxorp_service_name == 'sanctum-yxorp-kvin-stage.service'
          - yxorp_container_name == 'sanctum-yxorp-kvin-stage'
          - yxorp_image is match('^docker.io/library/nginx@sha256:[a-f0-9]{64}$')
        fail_msg: >-
          Kvin HTTP:80 stage requires explicit separate authorization.
          Production cutover, Kvar NPM and DNS remain untouched.

    - name: Check that the production Quadlet is not present
      ansible.builtin.stat:
        path: /etc/containers/systemd/sanctum-yxorp.container
        follow: false
      register: kvin_stage_production_quadlet

    - name: Check that the separate production service is not running
      ansible.builtin.command:
        argv: [systemctl, is-active, sanctum-yxorp.service]
      register: kvin_stage_production_unit
      changed_when: false
      failed_when: false

    - name: Refuse staging over an existing production YXORP service
      ansible.builtin.assert:
        that:
          - not (kvin_stage_production_quadlet.stat.exists | default(false))
          - kvin_stage_production_unit.rc != 0
        fail_msg: >-
          Kvin production YXORP state exists; do not stage or disturb
          its port 80 until the owner separately reconciles production.

    - name: Check whether the exact stage Quadlet already exists
      ansible.builtin.stat:
        path: "{{ yxorp_quadlet_file }}"
        follow: false
      register: kvin_stage_quadlet

    - name: Reject non-regular stage Quadlet before inspecting or overwriting
      ansible.builtin.assert:
        that:
          - kvin_stage_quadlet.stat.isreg | default(false)
          - not (kvin_stage_quadlet.stat.islnk | default(false))
      when: kvin_stage_quadlet.stat.exists

    - name: Inspect installed stage Quadlet without changing it
      ansible.builtin.slurp:
        src: "{{ yxorp_quadlet_file }}"
      register: kvin_stage_quadlet_contents
      when: kvin_stage_quadlet.stat.exists

    - name: Refuse adopting a modified or unrelated existing Quadlet
      ansible.builtin.assert:
        that:
          - "'ContainerName=sanctum-yxorp-kvin-stage' in quadlet_lines"
          - "'Network=host' in quadlet_lines"
          - "quadlet_lines | select('match', '^Network=') | list | length == 1"
          - "quadlet_lines | select('match', '^PublishPort=') | list | length == 0"
          - "('Volume=' ~ yxorp_active_config ~ ':/etc/nginx/nginx.conf:ro,Z') in quadlet_lines"
        fail_msg: Existing stage Quadlet is not the owned rootful host-network test.
      vars:
        quadlet_lines: "{{ (kvin_stage_quadlet_contents.content | b64decode).splitlines() }}"
      when: kvin_stage_quadlet.stat.exists

    - name: Check stage configuration directory for unexpected ownership
      ansible.builtin.stat:
        path: "{{ yxorp_config_dir }}"
        follow: false
      register: kvin_stage_config_dir

    - name: Refuse symlinked or non-directory stage configuration path
      ansible.builtin.assert:
        that:
          - kvin_stage_config_dir.stat.isdir | default(false)
          - not (kvin_stage_config_dir.stat.islnk | default(false))
      when: kvin_stage_config_dir.stat.exists

    - name: Inventory any existing stage-only configuration files
      ansible.builtin.find:
        paths: "{{ yxorp_config_dir }}"
        recurse: true
        hidden: true
        follow: false
        file_type: any
      register: kvin_stage_existing_files
      when: kvin_stage_config_dir.stat.exists

    - name: Reject unexpected files before rendering into stage directory
      ansible.builtin.assert:
        that:
          - item.path in [yxorp_candidate_config, yxorp_active_config]
          - not (item.isdir | default(false))
          - not (item.islnk | default(false))
        fail_msg: Stage directory contains files outside this role's ownership.
      loop: "{{ kvin_stage_existing_files.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Observe any existing TCP port 80 listener
      ansible.builtin.command:
        argv: [ss, -H, -ltnp, "sport = :80"]
      register: kvin_stage_port80
      changed_when: false

    - name: Observe whether the exact stage service is already active
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ yxorp_service_name }}"]
      register: kvin_stage_unit
      changed_when: false
      failed_when: false

    - name: Refuse taking port 80 away from another service
      ansible.builtin.assert:
        that:
          - >-
            (kvin_stage_port80.stdout_lines | length == 0) or
            (kvin_stage_unit.rc == 0 and
             (kvin_stage_quadlet.stat.isreg | default(false)) and
             not (kvin_stage_quadlet.stat.islnk | default(false)))
        fail_msg: TCP 80 is occupied by an unidentified listener; do not stage.

    # Square is a separately selected *stage-only* candidate. The
    # checked-in production route manifest remains Yarn-only. Do not
    # activate other legacy hosts just because they were in Kvar NPM.
    - name: Require approved Square staging and the exact retained manifest state
      ansible.builtin.assert:
        that:
          - yxorp_routes | length == 8
          - yxorp_routes[0].hostname == 'yarn.nexus.sanctum'
          - yxorp_routes[0].enabled | bool
          - yxorp_routes[1].hostname == 'square.nexus.sanctum'
          - not (yxorp_routes[1].enabled | bool)
          - yxorp_routes[1].upstream_scheme == 'http'
          - yxorp_routes[1].upstream_host == 'kvin.outer.sanctum'
          - yxorp_routes[1].upstream_port | int == 8085
          - yxorp_routes[1].websocket | bool
          - (yxorp_routes | selectattr('enabled', 'equalto', true) | map(attribute='hostname') | list) == ['yarn.nexus.sanctum']
        fail_msg: >-
          Square test requires the explicitly selected Nextcloud backend
          and the intact Yarn-only baseline. Do not adopt a different
          manifest or enable all proxy hosts.
      when: yxorp_stage_square_approved | default(false) | bool

    - name: Enable only Square alongside Yarn in this Kvin stage invocation
      ansible.builtin.set_fact:
        yxorp_routes: "{{ [yxorp_routes[0], (yxorp_routes[1] | combine({'enabled': true}))] + yxorp_routes[2:] }}"
      when: yxorp_stage_square_approved | default(false) | bool

    # Prism is the next isolated canary after Square's accepted anonymous
    # redirect. Keep both previously tested vhosts in the stage during the
    # next trial; no changes to the production manifest or its disabled flags.
    - name: Require approved Prism staging on top of Yarn and Square only
      ansible.builtin.assert:
        that:
          - yxorp_stage_square_approved | bool
          - yxorp_routes | length == 8
          - yxorp_routes[0].hostname == 'yarn.nexus.sanctum'
          - yxorp_routes[1].hostname == 'square.nexus.sanctum'
          - yxorp_routes[2].hostname == 'joule.nexus.sanctum'
          - not (yxorp_routes[2].enabled | bool)
          - yxorp_routes[2].upstream_scheme == 'http'
          - yxorp_routes[2].upstream_host == 'kvin.outer.sanctum'
          - yxorp_routes[2].upstream_port | int == 8084
          - yxorp_routes[2].websocket | bool
          - (yxorp_routes | selectattr('enabled', 'equalto', true) | map(attribute='hostname') | list) == ['yarn.nexus.sanctum', 'square.nexus.sanctum']
        fail_msg: >-
          Prism may be enabled only as a Kvin stage trial after selecting
          the accepted Yarn and Square hosts. No production route or other
          legacy host can be enabled through this opt-in.
      when: yxorp_stage_prism_approved | default(false) | bool

    - name: Enable only Prism in addition to accepted Yarn and Square on Kvin
      ansible.builtin.set_fact:
        yxorp_routes: "{{ yxorp_routes[:2] + [(yxorp_routes[2] | combine({'enabled': true}))] + yxorp_routes[3:] }}"
      when: yxorp_stage_prism_approved | default(false) | bool

    # Keep the three accepted HTTP routes visible in this stage while
    # testing Search. Never modify the checked-in production manifest.
    - name: Require Search staging on top of Yarn Square and Prism only
      ansible.builtin.assert:
        that:
          - yxorp_stage_square_approved | bool
          - yxorp_stage_prism_approved | bool
          - yxorp_routes | length == 8
          - yxorp_routes[0].hostname == 'yarn.nexus.sanctum'
          - yxorp_routes[1].hostname == 'square.nexus.sanctum'
          - yxorp_routes[2].hostname == 'joule.nexus.sanctum'
          - yxorp_routes[3].hostname == 'search.nexus.sanctum'
          - not (yxorp_routes[3].enabled | bool)
          - yxorp_routes[3].upstream_scheme == 'http'
          - yxorp_routes[3].upstream_host == 'kvin.outer.sanctum'
          - yxorp_routes[3].upstream_port | int == 8083
          - not (yxorp_routes[3].websocket | bool)
          - (yxorp_routes | selectattr('enabled', 'equalto', true) | map(attribute='hostname') | list) == ['yarn.nexus.sanctum', 'square.nexus.sanctum', 'joule.nexus.sanctum']
        fail_msg: >-
          The Search candidate requires the exact three accepted
          Kvin-stage HTTP hosts and the known local 8083 backend.
      when: yxorp_stage_search_approved | default(false) | bool

    - name: Enable only Search in addition to three accepted Kvin stage routes
      ansible.builtin.set_fact:
        yxorp_routes: "{{ yxorp_routes[:3] + [(yxorp_routes[3] | combine({'enabled': true}))] + yxorp_routes[4:] }}"
      when: yxorp_stage_search_approved | default(false) | bool

    # Host firewalld is intentionally not a deployment prerequisite:
    # its LAN admission is independently owned by Maintenance. A local
    # HTTP:80 stage can bind and be accepted on Kvin without opening
    # the port from other hosts. The separate peer probe handles LAN
    # acceptance only after the host owner admits HTTP:80.
  roles:
    - yxorp

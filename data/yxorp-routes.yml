---
# Desired YXORP proposal compared with Kvar's 2026-11-08 NPM default routes.
# The eight observed NPM names are accounted for in enabled/disabled route
# entries or explicitly excluded as the old NPM administration UI.
# This is NOT yet complete behavioral equivalence (headers/custom locations).
# Only Yarn is enabled for the initial rootful Peanut HTTP:80 trial.
# Disabled routes are staging gates, NOT retirement decisions. Preserve
# incumbent NPM host entries in the migration baseline unless the operator
# explicitly approves an exception; test routes individually before enabling.
yxorp_routes:
  - hostname: yarn.nexus.sanctum
    upstream_scheme: http
    upstream_host: yarn.inner.sanctum
    upstream_port: 80
    websocket: false
    enabled: true
    provenance: requested_november_8; distinguish_existing_yarn_inner_route

  - hostname: square.nexus.sanctum
    upstream_scheme: http
    upstream_host: kvin.outer.sanctum
    upstream_port: 8085
    websocket: true
    enabled: false
    provenance: nextcloud_services_runbook; verify_live_headers_and_clients

  - hostname: joule.nexus.sanctum
    upstream_scheme: http
    upstream_host: kvin.outer.sanctum
    upstream_port: 8084
    websocket: true
    enabled: false
    provenance: project_joule_prism_browser_origin; websocket_required

  - hostname: search.nexus.sanctum
    upstream_scheme: http
    upstream_host: kvin.outer.sanctum
    upstream_port: 8083
    websocket: false
    enabled: false
    provenance: maintenance_kvar_observed_proxy_to_kvin

  - hostname: dir.nexus.sanctum
    upstream_scheme: http
    upstream_host: kvar.outer.sanctum
    upstream_port: 8081
    websocket: false
    enabled: false
    provenance: legacy_linkstack_on_kvar; change_after_kvin_restore

  - hostname: kuma.nexus.sanctum
    upstream_scheme: http
    upstream_host: kvar.outer.sanctum
    upstream_port: 3001
    websocket: true
    enabled: false
    provenance: legacy_kuma_on_kvar; change_after_retained_kvin_acceptance

  - hostname: pihole.nexus.sanctum
    upstream_scheme: http
    upstream_host: kvar.outer.sanctum
    upstream_port: 82
    websocket: false
    enabled: false
    provenance: november_8_kvar_npm_7_conf; retain_pihole_ad_blocking; requalify_ui_on_kvin

  # Existing NPM proxy-host 11.conf: required migration baseline entry,
  # distinct from the new yarn.nexus name. Disabled here only because its
  # staging HTTP behavior has not yet been tested from Kvin. Do not infer
  # that direct DNS mapping makes this proxy route disposable.
  - hostname: yarn.inner.sanctum
    upstream_scheme: http
    upstream_host: 192.168.1.110
    upstream_port: 80
    websocket: false
    enabled: false
    provenance: november_8_kvar_npm_11_conf; existing_proxy_route_pending_kvin_stage_qualification

# Intentionally not rendered until their effective upstream and semantics
# are independently established. NPM's management UI is not being rebuilt.
# Current old NPM admin route: yxorp.nexus.sanctum -> kvar.outer.sanctum:81.
# Retain this observation for cutover planning but omit the UI on Kvin.
yxorp_unresolved_routes:
  - hostname: yxorp.nexus.sanctum
    reason: old_NPM_admin_UI_not_part_of_plain_nginx_replacement
